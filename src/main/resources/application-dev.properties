spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:school10ssr}?sslMode=preferred&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

#Logging configuration
#logging.level.root=INFO default
logging.level.gr.aueb.cf.schoolapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

#for production you may want JSON
#logging.structured.format.console=ecs logstash or gelf

#rolling policy for log files (default is 10MB, 7 days retention)
logging.file.name=logs/schoolapp.log


#Disable cache for local development
spring.thymeleaf.cache=false
